karen:{name:'Karen Webb',photo:'assets/images/karen-webb.jpg',role:'DRE #01452599 &middot; CAL BAR# 277956 &middot; Licensed attorney',email:'karen.webbrealty@gmail.com',phone:'707-334-2633',bio:['Karen received her B.S. in International Relations and Japanese from San Francisco State University. She became a real estate agent in 2003 and a real estate broker in 2005. She launched Webb Realty in 2005 as a small, independent brokerage house in order to give clients an option that wasn&rsquo;t a big corporation. Karen wanted to offer a personal touch that other brokerages weren&rsquo;t. Karen is also a licensed attorney. She is an active member of the National Association of Realtors, the California Association of Realtors, the North Bay Association of Realtors and the California State Bar Association.','Karen is highly involved in her community. She is a member of Rotary International and has volunteered as a basketball coach for the last four years with CYO and AAU teams in West County. For fun, Karen enjoys riding motorcycles, traveling, surfing, paddle boarding, hiking, playing basketball and snowboarding with her two daughters.','15 years of representing buyers and sellers in Sonoma County and surrounding areas. Sebastopol area (West County), country properties, cannabis properties and fixers are her specialty.']},
naomi:{name:'Naomi Ananda Natalini',photo:'assets/images/naomi.jpg',role:'DRE #01428509',email:'naomipua@yahoo.com',phone:'707-888-7238',bio:['Naomi Ananda Natalini, a lifelong Sonoma County resident, combines deep local knowledge with a passion for helping clients find the perfect place to call home. Known for her approachable style and clear communication, Naomi makes the buying and selling process seamless and stress-free. A proud mom to a teenage son, she enjoys photography, paddle boarding, hiking, attending live music events, and savoring the local food scene &mdash; passions that reflect her love for the community and the lifestyle Sonoma County has to offer.']},
jeffrey:{name:'Jeffrey Seligson',photo:'assets/images/jeffrey.jpg',role:'DRE #01338922 &middot; Certified EcoBroker &middot; Seniors Real Estate Specialist',email:'jseligsonrealtor@gmail.com',phone:'707-217-3642',bio:['Jeffrey Seligson, Certified EcoBroker and Seniors Real Estate Specialist, is a meticulous, seasoned West County agent who specializes in residential, multi-unit and commercial real estate transactions. He possesses a depth of knowledge in well and septic, and &ldquo;green building&rdquo; practices, which increase property values, indoor air quality, and comfort, and reduce cost of ownership and climate change impact. His extensive database includes contractors, energy rating providers, water quality specialists, solar energy installers, and xeriscape landscapers.','Jeffrey adds value to your transaction with help in pre-listing property preparation, remodeling and construction, shared equity tenancy agreements, property problem solving, and is comfortable working under unique and challenging circumstances. For 21 years, Jeffrey has worked for local brokers, winning top producer awards including Leading Edge Society, President&rsquo;s Club and the Director&rsquo;s Circle. Seven years running, he won Best Sonoma County Agent in the North Bay Bohemian&rsquo;s 2007&ndash;2013 Reader&rsquo;s Polls.','Jeffrey Seligson is a 39-year resident of the Bay Area, and has lived in Sebastopol for 36 years. His time here has acquainted him with the unique regions of the area, as well as with the wonderful local resources and specialists who are invaluable to property owners. Jeffrey and his family spend free time hiking, working in the garden, exploring favorite beaches, playing music in their living room or going for bike rides.','Jeffrey practices real estate with the intention of enriching the lives of his clients, and with the goal of earning his clients&rsquo; business and referrals for many years to come. He stands on his head for his clients if that&rsquo;s what it takes to get the job done! &iexcl;Yo hablo espa&ntilde;ol! &iexcl;Me gusta!']}
